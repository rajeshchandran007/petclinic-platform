# ServiceAccount for customers-service (PETPLAT-41)
# Spec: docs/technical-spec.md#manifest-file-structure
# No IRSA annotation: the pod makes no AWS API calls (secrets arrive via ESO).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customers-service
  labels:
    app.kubernetes.io/name: customers-service
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: service
automountServiceAccountToken: false
