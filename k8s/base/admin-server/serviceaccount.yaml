# ServiceAccount for admin-server (PETPLAT-44)
# Spec: docs/technical-spec.md#manifest-file-structure
# No IRSA annotation: the pod makes no AWS API calls (secrets arrive via ESO).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-server
  labels:
    app.kubernetes.io/name: admin-server
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: admin
automountServiceAccountToken: false
