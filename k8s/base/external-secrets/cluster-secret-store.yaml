# ClusterSecretStore for AWS Secrets Manager (PETPLAT-34)
# Spec: docs/technical-spec.md#clustersecretstore-configuration
#
# Environment-agnostic: each EKS cluster's external-secrets-sa is annotated with
# its own petclinic-{env}-eso-role, which can only read petclinic/{env}/*.
#
# apiVersion is external-secrets.io/v1 (the spec snippet shows v1beta1, which
# ESO 2.x no longer serves).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: aws-secrets-manager
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/managed-by: kubectl
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
  # Only the application namespaces may reference this store.
  conditions:
    - namespaces:
        - petclinic-dev
        - petclinic-prod
