# ExternalSecret: RDS master credentials (PETPLAT-35)
# Spec: docs/technical-spec.md#externalsecret-manifests
#
# Syncs the JSON secret petclinic/{env}/rds-credentials (created by the rds
# module, PETPLAT-23) into the K8s Secret "rds-credentials" with keys
# username and password. Consumed by customers-, visits- and vets-service.
#
# Template: ${...} placeholders are filled by
#   ./scripts/render-external-secrets.sh {env} | kubectl apply -f -
#
#   ${ENVIRONMENT}  dev | prod
#   ${NAMESPACE}    petclinic-{env}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/managed-by: kubectl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: rds-credentials
          app.kubernetes.io/part-of: petclinic
          app.kubernetes.io/component: infrastructure
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/${ENVIRONMENT}/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/${ENVIRONMENT}/rds-credentials
        property: password
