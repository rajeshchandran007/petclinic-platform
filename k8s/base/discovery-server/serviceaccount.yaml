# ServiceAccount for discovery-server (PETPLAT-40)
# Spec: docs/technical-spec.md#manifest-file-structure
# No IRSA annotation: the pod makes no AWS API calls (secrets arrive via ESO).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery-server
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
automountServiceAccountToken: false
