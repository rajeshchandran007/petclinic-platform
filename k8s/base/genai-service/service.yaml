# ClusterIP Service for genai-service (PETPLAT-42)
# Spec: docs/technical-spec.md#service-inventory
apiVersion: v1
kind: Service
metadata:
  name: genai-service
  labels:
    app.kubernetes.io/name: genai-service
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: genai-service
    app.kubernetes.io/part-of: petclinic
  ports:
    - name: http
      port: 8084
      targetPort: http
      protocol: TCP
      appProtocol: http
