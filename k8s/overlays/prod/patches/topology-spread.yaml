# Prod HA (PETPLAT-46): spread replicas of each Deployment across nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any # replaced by the patch target selector
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: petclinic
          matchLabelKeys:
            - pod-template-hash
